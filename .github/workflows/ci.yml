name: CI

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  windows:
    name: windows
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Build release
        run: cargo build --workspace --release
      - name: Upload retroengine.exe
        uses: actions/upload-artifact@v4
        with:
          name: retroengine-windows
          path: target/release/retroengine.exe
          if-no-files-found: error
